<div class="listar-pacote">
    <h1>Lista de Pacotes</h1>
    <p>Todos os seus pacotes estão listados aqui.</p>
    <mat-table [dataSource]="pacotes" class="pacotes-table">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef>
                ID
            </mat-header-cell>
            <mat-cell *matCellDef="let pacote">{{ pacote.id }}</mat-cell>
        </ng-container>

        <!-- Destino Column -->
        <ng-container matColumnDef="destino">
            <mat-header-cell *matHeaderCellDef>
                Destino
            </mat-header-cell>
            <mat-cell *matCellDef="let pacote" class="truncate-cell">
                <span [title]="pacote.endereco_destino">{{ pacote.endereco_destino }}</span>
            </mat-cell>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <mat-header-cell *matHeaderCellDef>
              Status
            </mat-header-cell>
            <mat-cell *matCellDef="let pacote">
                {{ pacote.status }}
            </mat-cell>
        </ng-container>

        <!-- Destinatário Column -->
        <ng-container matColumnDef="destinatario">
            <mat-header-cell *matHeaderCellDef>
               Destinatário
            </mat-header-cell>
            <mat-cell *matCellDef="let pacote" class="truncate-cell">
                <span [title]="pacote.destinatario">{{ pacote.destinatario }}</span>
            </mat-cell>
        </ng-container>

        <!-- Rastreamento Column -->
        <ng-container matColumnDef="rastreamento">
            <mat-header-cell *matHeaderCellDef>
               Rastreamento
            </mat-header-cell>
            <mat-cell *matCellDef="let pacote" class="truncate-cell">
                <span [title]="pacote.codigo_rastreamento">{{ pacote.codigo_rastreamento }}</span>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

        <!-- No data row -->
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                <div class="empty-state">
                    <mat-icon>inbox</mat-icon>
                    <p>Nenhum pacote encontrado</p>
                </div>
            </td>
        </tr>
    </mat-table>
