<!-- login-form.component.html -->
<div class="login-form-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Bem-vindo de volta!</h1>
      <p>Entre com suas credenciais para acessar o sistema</p>
    </div>

    <div class="login-content">
      <form (submit)="onSubmit($event)" class="login-form">

        <!-- Campo Email -->
        <div class="form-field">
          <label for="email">Email</label>
          <div class="input-container">
            <input 
              id="email"
              type="text" 
              placeholder="sample@example.com"
              [value]="formData.email"
              (input)="onInputChange($event,'email')"
              (blur)="onFieldTouch('email')"
              [class.error]="hasError('email')">
            <mat-icon class="input-icon">person</mat-icon>
          </div>

            <div class="error-message">
            <mat-icon class="error-icon" *ngIf="hasError('email')">error</mat-icon>
            <span *ngIf="hasError('email')">{{ getError('email') }}</span>
            </div>
        </div>

        <!-- Campo Senha -->
        <div class="form-field">
          <label for="password">Senha</label>
          <div class="input-container">
            <input 
              id="password"
              [type]="hidePassword ? 'password' : 'text'"
              placeholder="Digite sua senha"
              [value]="formData.password"
              (input)="onInputChange( $event, 'password')"
              (blur)="onFieldTouch('password')"
              [class.error]="hasError('password')">
            <button 
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </div>
          <div class="error-message" *ngIf="hasError('password')">
            <mat-icon class="error-icon">error</mat-icon>
            <span>{{ getError('password') }}</span>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="form-actions">
          <button 
            type="submit"
            class="submit-button"
            [disabled]="!isFormValid || isLoading">
            <mat-icon class="button-icon" *ngIf="isLoading">hourglass_empty</mat-icon>
            <span>{{ isLoading ? 'Entrando...' : 'Entrar' }}</span>
          </button>

        </div>

        <!-- Links Adicionais -->
        <div class="form-links">
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
          <a href="#" class="create-account">Criar uma conta</a>
        </div>

      </form>
    </div>
  </div>
</div>
